<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D10">
  <title>Recall Tip Review</title>
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <style>
    /* Review-page layout only. */
    .rv {
      max-width: 720px;
      margin: 0 auto;
      padding: var(--space-10) var(--gutter) var(--space-16);
    }
    .rv-title {
      margin: var(--space-6) 0 var(--space-2);
      font-family: var(--font-display); font-weight: var(--weight-bold);
      font-size: var(--text-h2); line-height: var(--leading-h2); letter-spacing: var(--tracking-tight);
    }
    .rv-stats { margin: 0; color: var(--color-text-muted); }
    .rv-stats strong { color: var(--color-text); font-weight: var(--weight-medium); }

    .rv-bar {
      position: sticky; top: 0; z-index: 2;
      margin: var(--space-6) calc(var(--gutter) * -1) 0;
      padding: var(--space-3) var(--gutter);
      background: color-mix(in srgb, var(--color-bg) 88%, transparent);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: var(--border-hairline) solid var(--color-line);
      display: grid; gap: var(--space-3);
    }
    .rv-jump { display: flex; gap: var(--space-2); overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .rv-jump a {
      display: inline-flex; align-items: center; gap: var(--space-1);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-pill);
      border: var(--border-hairline) solid color-mix(in srgb, var(--cat) 45%, transparent);
      color: var(--cat); text-decoration: none; white-space: nowrap;
      font-size: var(--text-small); font-weight: var(--weight-medium);
    }
    .rv-jump a:hover { background: color-mix(in srgb, var(--cat) 12%, transparent); }
    .rv-jump .icon { width: 14px; height: 14px; }
    .rv-filter .chip { min-height: 36px; font-size: var(--text-small); }

    .rv-section { padding-top: var(--space-10); scroll-margin-top: 120px; }
    .rv-h {
      display: flex; align-items: center; gap: var(--space-3);
      margin: 0 0 var(--space-4);
      font-family: var(--font-display); font-weight: var(--weight-bold);
      font-size: var(--text-h3); line-height: var(--leading-h3);
    }
    .rv-h .icon { color: var(--cat); }
    .rv-h__count { margin-left: auto; color: var(--color-text-subtle); font-family: var(--font-body); font-weight: var(--weight-regular); font-size: var(--text-small); }

    .rv-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
    .rv-tip {
      display: grid; grid-template-columns: 28px 1fr; gap: var(--space-3);
      padding: var(--space-4);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      border: var(--border-hairline) solid var(--color-border);
      box-shadow: var(--shadow-inset-top);
    }
    .rv-tip[hidden] { display: none; }
    .rv-num { color: var(--cat); font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: var(--text-small); padding-top: 2px; }
    .rv-tip__title {
      margin: 0;
      font-family: var(--font-display); font-weight: var(--weight-bold);
      font-size: var(--text-h3); line-height: var(--leading-h3); letter-spacing: var(--tracking-tight);
    }
    .rv-tip__text { margin: var(--space-1) 0 0; color: var(--color-text-muted); }
    .rv-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); margin-top: var(--space-2); color: var(--color-text-subtle); font-size: var(--text-small); }
    .rv-meta span { display: inline-flex; align-items: center; gap: var(--space-1); }
    .rv-badge {
      padding: 1px var(--space-2); border-radius: var(--radius-pill);
      border: var(--border-hairline) solid var(--color-border-strong);
      color: var(--color-text-muted);
    }
    .rv-badge--league { border-color: color-mix(in srgb, var(--color-brand) 60%, transparent); color: var(--color-brand-text); }
    .rv-badge--active { background: var(--color-brand); border-color: var(--color-brand); color: var(--color-text-on-brand); }
    .rv-badge--expired { opacity: 0.6; }

    .rv-daily .rv-tip { grid-template-columns: 1fr; }
    .rv-daily .rv-tip.is-expired { opacity: 0.55; }
    .rv-reaction { margin: 0 0 var(--space-1); font-family: var(--font-display); font-weight: var(--weight-semibold); font-size: var(--text-body-lg); line-height: var(--leading-body-lg); }
    .rv-section > .rv-fact { margin: 0 0 var(--space-4); }
    .rv-fact { margin: var(--space-2) 0 0; color: var(--color-text-subtle); font-size: var(--text-small); }

  </style>
</head>
<body>
<main class="rv">
  <p class="logo logo--sm">Recall<span class="logo__dot">.</span></p>
  <h1 class="rv-title">Tip review</h1>
  <p class="rv-stats" id="stats"></p>

  <div class="rv-bar">
    <nav class="rv-jump" id="jump" aria-label="Jump to category"></nav>
    <div class="chips rv-filter" role="group" aria-label="Filter tips">
      <button class="chip" type="button" data-filter="all" aria-pressed="true"><svg class="icon chip__check"><use href="./icons.svg#check"/></svg>All</button>
      <button class="chip" type="button" data-filter="league" aria-pressed="false"><svg class="icon chip__check"><use href="./icons.svg#check"/></svg>League refs</button>
      <button class="chip" type="button" data-filter="plain" aria-pressed="false"><svg class="icon chip__check"><use href="./icons.svg#check"/></svg>No League refs</button>
    </div>
  </div>

  <div id="content"></div>
</main>

<script type="module" src="./src/tips-review.js"></script>
</body>
</html>
